syntax = "proto3";

option go_package = "github.com/loveyourstack/lys/internal/pb";

package pb;

import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";

import "internal/myapp/svcproto/common.proto";
import "internal/stores/core/coreuuidtest/coreuuidtest.proto";

message ListCoreUuidTestResp { 
  repeated CoreUuidTest data = 1;
  optional GetMetadata  metadata = 2;
}

message UpdateCoreUuidTestReq {
  string                    id = 1;
  CoreUuidTestInput         input = 2;
  google.protobuf.FieldMask field_mask = 3;
}

service CoreUuidTestSvc {
  rpc List(ListReq)                 returns (ListCoreUuidTestResp);
  rpc Get(GetByUuidReq)             returns (CoreUuidTest);
  rpc Create(CoreUuidTestInput)     returns (CoreUuidTest);
  rpc Update(UpdateCoreUuidTestReq) returns (CoreUuidTest);
  rpc Delete(DeleteByUuidReq)       returns (google.protobuf.Empty);
}