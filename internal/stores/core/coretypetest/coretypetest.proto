syntax = "proto3";

option go_package = "github.com/loveyourstack/lys/internal/pb";

package pb;

import "google/protobuf/timestamp.proto";

message CoreTypeTestInput {
  bool c_bool = 1;
  optional bool c_booln = 2;
  repeated bool c_boola = 3;
  int64 c_int = 4;
  optional int64 c_intn = 5;
  repeated int64 c_inta = 6;
  double c_double = 7;
  optional double c_doublen = 8;
  repeated double c_doublea = 9;
  double c_numeric = 10;
  optional double c_numericn = 11;
  repeated double c_numerica = 12;

  // lystype date and time values are encoded using their JSON string formats.
  string c_date = 13;
  optional string c_daten = 14;
  repeated string c_datea = 15;
  string c_time = 16;
  optional string c_timen = 17;
  repeated string c_timea = 18;
  
  google.protobuf.Timestamp c_datetime = 19;
  optional google.protobuf.Timestamp c_datetimen = 20;
  repeated google.protobuf.Timestamp c_datetimea = 21;
  string c_enum = 22;
  optional string c_enumn = 23;
  repeated string c_enuma = 24;
  string c_text = 25;
  optional string c_textn = 26;
  repeated string c_texta = 27;
}

message CoreTypeTest {
  int64 id = 1;
  string id_uu = 2;

  bool c_bool = 3;
  optional bool c_booln = 4;
  repeated bool c_boola = 5;
  int64 c_int = 6;
  optional int64 c_intn = 7;
  repeated int64 c_inta = 8;
  double c_double = 9;
  optional double c_doublen = 10;
  repeated double c_doublea = 11;
  double c_numeric = 12;
  optional double c_numericn = 13;
  repeated double c_numerica = 14;
  string c_date = 15;
  optional string c_daten = 16;
  repeated string c_datea = 17;
  string c_time = 18;
  optional string c_timen = 19;
  repeated string c_timea = 20;
  google.protobuf.Timestamp c_datetime = 21;
  optional google.protobuf.Timestamp c_datetimen = 22;
  repeated google.protobuf.Timestamp c_datetimea = 23;
  string c_enum = 24;
  optional string c_enumn = 25;
  repeated string c_enuma = 26;
  string c_text = 27;
  optional string c_textn = 28;
  repeated string c_texta = 29;
}
